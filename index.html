<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co Caro Vo Tan - Online</title>
    <style>
        /* --- THIET LAP CSS CO BAN --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* Slate 900 */
            color: #f1f5f9; /* Slate 100 */
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- UI COMPONENTS --- */
        #thong_tin {
            flex: 0 0 auto;
            padding: 1rem;
            background-color: #1e293b; /* Slate 800 */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: bold;
            color: #facc15; /* Yellow 400 */
        }

        .bang_dieu_khien {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .luot_choi_hien_thi {
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
            font-weight: bold;
        }

        .xanh { background-color: #3b82f6; color: white; }
        .do { background-color: #ef4444; color: white; }
        .vang { background-color: #facc15; color: black; }

        button {
            background-color: #334155;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 500;
        }
        button:hover { background-color: #475569; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary { background-color: #2563eb; } /* Blue 600 */
        .btn-primary:hover { background-color: #1d4ed8; }

        /* --- PHAN BAN CO --- */
        #khung_ban_co {
            flex: 1 1 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            position: relative;
        }

        #luoi_co {
            display: grid;
            background-color: #334155;
            gap: 1px;
            border: 1px solid #334155;
        }

        .o_co {
            background-color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .o_co:hover { background-color: #334155; }
        .quan_x { color: #ef4444; }
        .quan_o { color: #3b82f6; }
        
        .o_thang {
            background-color: #422006 !important;
            box-shadow: inset 0 0 0 2px #facc15;
        }
        .o_thang .quan_x, .o_thang .quan_o { color: #facc15; }

        /* --- MODAL QR CODE --- */
        #modal_qr {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none; /* Mac dinh an */
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .modal_content {
            background: #1e293b;
            padding: 2rem;
            border-radius: 0.5rem;
            text-align: center;
            max-width: 90%;
            width: 350px;
        }
        .qr_image {
            background: white;
            padding: 10px;
            border-radius: 4px;
            margin: 1rem 0;
            width: 200px;
            height: 200px;
        }
        .link_box {
            background: #0f172a;
            padding: 0.5rem;
            border-radius: 4px;
            word-break: break-all;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 1rem;
            cursor: pointer;
        }
        .status_text {
            color: #facc15;
            margin-bottom: 1rem;
            font-style: italic;
        }

    </style>
</head>
<body>

    <div id="thong_tin">
        <h1>XO Online</h1>
        <div class="bang_dieu_khien">
            <div id="trang_thai_luot">
                Lượt: <span id="hien_thi_luot" class="luot_choi_hien_thi do">X</span>
            </div>
            
            <button id="btn_tao_phong" onclick="tao_phong_moi()" class="btn-primary" disabled>Đang kết nối...</button>
            <button id="btn_choi_lai" onclick="xu_ly_choi_lai()" style="display:none;">Ván Mới</button>
        </div>
    </div>

    <div id="khung_ban_co">
        <div id="luoi_co"></div>
        <div id="loading" style="position: absolute; display: none;">Đang tải...</div>
    </div>

    <div id="modal_qr">
        <div class="modal_content">
            <h2 style="margin-top:0">Quét mã để chơi</h2>
            <div class="status_text">Đang chờ người chơi thứ 2...</div>
            <img id="anh_qr" class="qr_image" src="" alt="QR Code">
            <div id="link_phong" class="link_box" onclick="copy_link()" title="Click để copy"></div>
            <button onclick="dong_modal()">Đóng</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CAU HINH FIREBASE ---
        // Lay config tu moi truong Preview hoac object rong neu chay local
        const firebaseConfig = {

  apiKey: "AIzaSyA2Q9kQMtdXu9D22yaNH618EbcIs2cNVGU",

  authDomain: "xogame-27755.firebaseapp.com",

  projectId: "xogame-27755",

  storageBucket: "xogame-27755.firebasestorage.app",

  messagingSenderId: "407277278988",

  appId: "1:407277278988:web:62872131b964dbfe289b29"

};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // --- BIEN TOAN CUC (GAME STATE) ---
        let user_id = null;
        let room_id = null;
        let is_host = false;
        let my_role = 'X'; // X hoac O (Host luon la X)
        
        let cac_nuoc_di = {}; 
        let luot_choi = 'X';
        let nguoi_thang = null;
        let hang_thang = [];
        
        const SO_QUAN_THANG = 5;
        const PADDING = 3;

        // --- KHOI TAO APP ---
        async function init() {
            try {
                // UU TIEN 1: Dang nhap bang token he thong (neu co)
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    // UU TIEN 2: Dang nhap an danh (Anonymous)
                    await signInAnonymously(auth);
                }
                
                user_id = auth.currentUser.uid;
                console.log("Logged in as:", user_id);
                
                // Kich hoat nut tao phong
                const btn = document.getElementById('btn_tao_phong');
                btn.textContent = "Tạo Phòng Online";
                btn.disabled = false;

            } catch (error) {
                console.error("Auth error:", error);
                document.getElementById('btn_tao_phong').textContent = "Lỗi Kết Nối";
                // Khong alert loi de tranh phien neu choi offline
                return;
            }

            // 2. Kiem tra URL xem co phai dang join phong khong (qua query param)
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');

            if (roomParam) {
                // Truong hop: JOIN PHONG
                room_id = roomParam;
                is_host = false;
                my_role = 'O'; // Nguoi join la O
                
                // An nut tao phong, hien thi trang thai
                document.getElementById('btn_tao_phong').style.display = 'none';
                document.querySelector('h1').textContent = "Phòng: " + room_id.substring(0,4);
                
                lang_nghe_phong(room_id);
            } else {
                // Truong hop: CHOI OFFLINE MAC DINH
                ve_ban_co();
            }
        }

        // --- CHUC NANG ONLINE ---
        
        // Ham duoc goi tu HTML
        window.tao_phong_moi = async function() {
            if (!user_id) {
                alert("Đang kết nối máy chủ, vui lòng đợi giây lát...");
                return;
            }
            
            const btn = document.getElementById('btn_tao_phong');
            btn.disabled = true;
            btn.textContent = "Đang tạo...";

            try {
                // Tao ID phong ngau nhien (6 ky tu)
                room_id = Math.random().toString(36).substring(2, 8).toUpperCase();
                is_host = true;
                my_role = 'X';

                // Du lieu khoi tao
                const gameData = {
                    cac_nuoc_di: {},
                    luot_choi: 'X',
                    nguoi_thang: null,
                    nguoi_tao: user_id,
                    nguoi_tham_gia: null, // Cho nguoi thu 2
                    ngay_tao: Date.now()
                };

                // Luu len Firestore
                const gameRef = doc(db, 'artifacts', appId, 'public', 'data', 'games', room_id);
                await setDoc(gameRef, gameData);

                // Hien thi QR Code
                hien_thi_qr(room_id);

                // Bat dau lang nghe thay doi
                lang_nghe_phong(room_id);
                
                // Cap nhat UI
                btn.style.display = 'none';
                document.querySelector('h1').textContent = "Phòng chủ: " + room_id;
            } catch (e) {
                console.error("Loi tao phong:", e);
                alert("Không thể tạo phòng. (Có thể do lỗi cấu hình Firebase). Vui lòng thử lại.");
                btn.disabled = false;
                btn.textContent = "Tạo Phòng Online";
                room_id = null;
            }
        }

        function hien_thi_qr(id) {
            const url = window.location.href.split('?')[0] + '?room=' + id;
            // Su dung API tao QR mien phi
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
            
            document.getElementById('anh_qr').src = qrUrl;
            document.getElementById('link_phong').textContent = url;
            document.getElementById('modal_qr').style.display = 'flex';
        }

        window.dong_modal = function() {
            document.getElementById('modal_qr').style.display = 'none';
        }
        
        window.copy_link = function() {
            const text = document.getElementById('link_phong').textContent;
            navigator.clipboard.writeText(text);
            alert("Đã copy link!");
        }

        function lang_nghe_phong(id) {
            const gameRef = doc(db, 'artifacts', appId, 'public', 'data', 'games', id);
            
            // Lang nghe real-time updates tu Firestore
            onSnapshot(gameRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // Dong bo du lieu ve Client
                    cac_nuoc_di = data.cac_nuoc_di || {};
                    luot_choi = data.luot_choi;
                    nguoi_thang = data.nguoi_thang;
                    
                    // Thong bao khi nguoi choi thu 2 vao
                    if (is_host && data.nguoi_tham_gia && document.getElementById('modal_qr').style.display === 'flex') {
                        dong_modal();
                        alert("Người chơi thứ 2 đã tham gia!");
                    }
                    
                    // Neu toi la O (join) va chua duoc ghi nhan, update len DB
                    if (!is_host && !data.nguoi_tham_gia && user_id) {
                        updateDoc(gameRef, { nguoi_tham_gia: user_id });
                    }

                    // Tinh toan lai duong thang thang (de hien thi mau vang)
                    if (nguoi_thang) {
                         tim_hang_thang_khi_sync();
                    } else {
                        hang_thang = [];
                    }

                    cap_nhat_ui_thong_tin();
                    ve_ban_co();
                } else {
                    if (!is_host) alert("Phòng không tồn tại hoặc đã bị xóa.");
                }
            }, (error) => {
                 console.error("Loi dong bo:", error);
            });
        }

        async function gui_nuoc_di(h, c) {
            if (!room_id) {
                // Che do Offline (choi mot minh)
                const id = `${h},${c}`;
                cac_nuoc_di[id] = luot_choi;
                kiem_tra_ket_thuc(h, c, luot_choi);
                if (!nguoi_thang) luot_choi = (luot_choi === 'X' ? 'O' : 'X');
                ve_ban_co();
                cap_nhat_ui_thong_tin();
                return;
            }

            // Che do Online
            if (luot_choi !== my_role) {
                console.log("Chua den luot cua ban");
                return;
            }

            const id = `${h},${c}`;
            const nuoc_moi = { ...cac_nuoc_di, [id]: my_role };
            
            // Tinh toan logic game
            const thang = tinh_toan_thang(h, c, my_role, nuoc_moi);
            const winner = thang ? my_role : null;
            const next_turn = winner ? my_role : (my_role === 'X' ? 'O' : 'X');

            const gameRef = doc(db, 'artifacts', appId, 'public', 'data', 'games', room_id);
            try {
                // Update 1 phan document (tiet kiem bang thong)
                await updateDoc(gameRef, {
                    [`cac_nuoc_di.${id}`]: my_role, 
                    luot_choi: next_turn,
                    nguoi_thang: winner
                });
            } catch (e) {
                 // Fallback: update toan bo neu cau truc phuc tap
                 await updateDoc(gameRef, {
                    cac_nuoc_di: nuoc_moi,
                    luot_choi: next_turn,
                    nguoi_thang: winner
                });
            }
        }

        window.xu_ly_choi_lai = async function() {
            if (room_id) {
                // Reset tren server
                const gameRef = doc(db, 'artifacts', appId, 'public', 'data', 'games', room_id);
                await updateDoc(gameRef, {
                    cac_nuoc_di: {},
                    luot_choi: 'X',
                    nguoi_thang: null
                });
            } else {
                // Reset local
                cac_nuoc_di = {};
                luot_choi = 'X';
                nguoi_thang = null;
                hang_thang = [];
                cap_nhat_ui_thong_tin();
                ve_ban_co();
            }
        }

        // --- LOGIC GAME CLIENT ---
        
        function tinh_toan_thang(h, c, player, board_state) {
             const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];
             for (let dir of directions) {
                const [dh, dc] = dir;
                let count = 1;
                let line = [`${h},${c}`];

                // Duyet ve phia duong (+)
                let i = 1;
                while (true) {
                    const k = `${h + dh * i},${c + dc * i}`;
                    if (board_state[k] === player) { count++; line.push(k); i++; } 
                    else break;
                }

                // Duyet ve phia am (-)
                let j = 1;
                while (true) {
                    const k = `${h - dh * j},${c - dc * j}`;
                    if (board_state[k] === player) { count++; line.push(k); j++; } 
                    else break;
                }
                if (count >= SO_QUAN_THANG) return line;
             }
             return null;
        }
        
        function kiem_tra_ket_thuc(h, c, player) {
            const line = tinh_toan_thang(h, c, player, cac_nuoc_di);
            if (line) {
                nguoi_thang = player;
                hang_thang = line;
            }
        }

        function tim_hang_thang_khi_sync() {
            // Quet de tim lai hang thang sau khi tai du lieu ve
            const keys = Object.keys(cac_nuoc_di);
            for (let key of keys) {
                if (cac_nuoc_di[key] === nguoi_thang) {
                    const [h, c] = key.split(',').map(Number);
                    const line = tinh_toan_thang(h, c, nguoi_thang, cac_nuoc_di);
                    if (line) {
                        hang_thang = line;
                        return;
                    }
                }
            }
        }

        // --- RENDER & BOUNDARIES (AUTO-SCALE) ---
        function lay_gioi_han() {
            const cac_khoa = Object.keys(cac_nuoc_di);
            if (cac_khoa.length === 0) return { min_h: -PADDING, max_h: PADDING, min_c: -PADDING, max_c: PADDING };

            let min_h = Infinity, max_h = -Infinity;
            let min_c = Infinity, max_c = -Infinity;

            cac_khoa.forEach(key => {
                const [h, c] = key.split(',').map(Number);
                if (h < min_h) min_h = h;
                if (h > max_h) max_h = h;
                if (c < min_c) min_c = c;
                if (c > max_c) max_c = c;
            });
            return { min_h: min_h - PADDING, max_h: max_h + PADDING, min_c: min_c - PADDING, max_c: max_c + PADDING };
        }

        function ve_ban_co() {
            const khung = document.getElementById('khung_ban_co');
            const luoi = document.getElementById('luoi_co');
            const gioi_han = lay_gioi_han();
            const so_hang = gioi_han.max_h - gioi_han.min_h + 1;
            const so_cot = gioi_han.max_c - gioi_han.min_c + 1;

            const rong = khung.clientWidth - 20;
            const cao = khung.clientHeight - 20;
            
            // Tinh toan kich thuoc o de vua man hinh
            let size = Math.min(rong / so_cot, cao / so_hang);
            if (size > 60) size = 60; // Max size
            
            luoi.style.gridTemplateColumns = `repeat(${so_cot}, ${size}px)`;
            luoi.style.gridTemplateRows = `repeat(${so_hang}, ${size}px)`;
            luoi.innerHTML = '';

            const font_size = Math.max(size * 0.6, 10);

            for (let h = gioi_han.min_h; h <= gioi_han.max_h; h++) {
                for (let c = gioi_han.min_c; c <= gioi_han.max_c; c++) {
                    const id = `${h},${c}`;
                    const o = document.createElement('div');
                    o.className = 'o_co';
                    o.style.fontSize = `${font_size}px`;
                    
                    if (cac_nuoc_di[id]) {
                        const q = cac_nuoc_di[id];
                        o.textContent = q;
                        o.classList.add(q === 'X' ? 'quan_x' : 'quan_o');
                    }
                    if (hang_thang.includes(id)) o.classList.add('o_thang');

                    o.onclick = () => xu_ly_click_o(h, c);
                    
                    luoi.appendChild(o);
                }
            }
        }

        function xu_ly_click_o(h, c) {
            const id = `${h},${c}`;
            if (nguoi_thang || cac_nuoc_di[id]) return;
            gui_nuoc_di(h, c);
        }

        function cap_nhat_ui_thong_tin() {
            const div = document.getElementById('trang_thai_luot');
            const btn_choi_lai = document.getElementById('btn_choi_lai');
            
            let role_text = "";
            if (room_id) {
                role_text = ` (Bạn là: <span class="${my_role === 'X' ? 'do' : 'xanh'}" style="padding:0 4px; border-radius:2px">${my_role}</span>)`;
            }

            if (nguoi_thang) {
                div.innerHTML = `<span class="vang" style="padding:4px 8px; font-weight:bold; border-radius:4px">CHIẾN THẮNG: ${nguoi_thang}</span>`;
                // Chi Host moi duoc restart game
                if (is_host || !room_id) btn_choi_lai.style.display = 'block';
            } else {
                div.innerHTML = `Lượt: <span class="luot_choi_hien_thi ${luot_choi === 'X' ? 'do' : 'xanh'}">${luot_choi}</span>${role_text}`;
                btn_choi_lai.style.display = 'none';
            }
        }

        window.addEventListener('resize', ve_ban_co);
        init();

    </script>
</body>
</html>
