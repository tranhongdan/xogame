<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Co Caro Vo Tan - Drag & Zoom</title>
    <style>
        /* --- CSS BIEN --- */
        :root { 
            --cell-size: 40px; 
            --font-size: 20px; 
        }

        /* --- CSS CO BAN --- */
        body { 
            margin: 0; padding: 0; 
            background-color: #0f172a; 
            color: #f1f5f9; 
            font-family: ui-sans-serif, system-ui, sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; /* Ngan cuon trang web */
            user-select: none; /* Ngan boi den text khi keo tha */
        }

        /* --- HEADER UI --- */
        #thong_tin { 
            flex: 0 0 auto; 
            padding: 0.75rem 1rem; 
            background-color: #1e293b; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
            z-index: 20; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 10px; 
        }
        .left-info { display: flex; flex-direction: column; gap: 4px; }
        h1 { margin: 0; font-size: 1.1rem; font-weight: bold; color: #facc15; }
        .bang_dieu_khien { display: flex; gap: 0.5rem; align-items: center; }
        
        .luot_choi_hien_thi { padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9rem; }
        .xanh { background-color: #3b82f6; color: white; }
        .do { background-color: #ef4444; color: white; }
        .vang { background-color: #facc15; color: black; }
        .den-luot-ban { color: #4ade80; font-weight: bold; font-size: 0.8rem; animation: pulse 2s infinite; display: inline-block; margin-left: 5px; }
        @keyframes pulse { 50% { opacity: .5; } }

        button { background-color: #334155; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 0.85rem; white-space: nowrap; }
        button:hover { background-color: #475569; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background-color: #2563eb; }
        .btn-warning { background-color: #d97706; }

        /* --- KHUNG BAN CO (DRAGGABLE AREA) --- */
        #khung_ban_co { 
            flex: 1; 
            overflow: hidden; /* An thanh cuon mac dinh */
            position: relative;
            background-color: #0f172a;
            cursor: grab; /* Con tro ban tay */
            touch-action: none; /* Tat cu chi mac dinh cua trinh duyet de tu xu ly */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #khung_ban_co:active { cursor: grabbing; }

        #luoi_co { 
            display: grid; 
            background-color: #334155; 
            gap: 1px; 
            border: 1px solid #334155; 
            /* Kich thuoc o co dong */
            grid-auto-rows: var(--cell-size);
            grid-auto-columns: var(--cell-size);
            /* Transform origin o giua de zoom dep hon */
            transform-origin: center center;
        }

        .o_co { 
            background-color: #1e293b; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; 
            font-weight: bold; 
            position: relative; 
            width: var(--cell-size);
            height: var(--cell-size);
            font-size: var(--font-size);
        }
        .o_co:hover { background-color: #334155; }
        .quan_x { color: #ef4444; } .quan_o { color: #3b82f6; }
        
        .o_vua_danh { background-color: #334155 !important; box-shadow: inset 0 0 0 2px #22d3ee; }
        .o_co.o_thang {
            background-color: #facc15 !important; 
            box-shadow: 0 0 15px #facc15, inset 0 0 0 2px #fff !important;
            animation: thang_cuoc 0.5s infinite alternate;
            z-index: 100;
        }
        .o_co.o_thang .quan_x, .o_co.o_thang .quan_o { color: #451a03 !important; }
        @keyframes thang_cuoc { from { transform: scale(1); } to { transform: scale(1.15); } }

        /* --- MODAL --- */
        .modal_overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 50; }
        .modal_content { background: #1e293b; padding: 2rem; border-radius: 0.5rem; text-align: center; width: 350px; max-width: 90%; }
        .qr_image { background: white; padding: 10px; border-radius: 4px; margin: 1rem 0; width: 200px; height: 200px; }
        .link_box { background: #0f172a; padding: 0.5rem; border-radius: 4px; color: #94a3b8; margin-bottom: 1rem; cursor: pointer; word-break: break-all; }
        .modal_actions { display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; }
        #ban_quyen { padding: 5px; text-align: center; font-size: 0.7rem; color: #64748b; background-color: #0f172a; border-top: 1px solid #1e293b; }
        
        /* Note ve thao tac */
        .tutorial-hint {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 20px;
            font-size: 0.75rem; color: #94a3b8; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="thong_tin">
        <div class="left-info">
            <h1>XO Online</h1>
            <div id="trang_thai_luot">
                <span id="hien_thi_luot" class="luot_choi_hien_thi do">X</span>
            </div>
        </div>
        
        <div class="bang_dieu_khien">
            <button id="btn_undo" onclick="gui_yeu_cau_undo()" class="btn-warning" style="display:none;" disabled>Xin lại (3)</button>
            <button id="btn_choi_lai" onclick="xu_ly_choi_lai()" class="btn-primary" style="display:none;">Ván Mới</button>
            <button id="btn_tao_phong" onclick="tao_phong_moi()" class="btn-primary" disabled>Kết nối...</button>
        </div>
    </div>

    <div id="khung_ban_co">
        <div id="luoi_co"></div>
        <div class="tutorial-hint" id="hint_text">Kéo để di chuyển • Lăn chuột/2 ngón để Zoom</div>
    </div>

    <div id="ban_quyen">Bản quyền: Trần Hồng Dân. Email: tranhongdan@tranphudlk.edu.vn</div>

    <div id="modal_qr" class="modal_overlay">
        <div class="modal_content">
            <h2 style="margin-top:0">Quét mã để chơi</h2>
            <div style="color:#facc15; margin-bottom:1rem; font-style:italic">Đang chờ người chơi thứ 2...</div>
            <img id="anh_qr" class="qr_image" src="" alt="QR Code">
            <div id="link_phong" class="link_box" onclick="copy_link()" title="Click để copy"></div>
            <button onclick="dong_modal('modal_qr')">Đóng</button>
        </div>
    </div>

    <div id="modal_confirm_undo" class="modal_overlay">
        <div class="modal_content">
            <h3 style="color:#facc15; margin-top:0">Yêu cầu đi lại</h3>
            <p>Đối thủ muốn xin đi lại nước vừa rồi.</p>
            <div class="modal_actions">
                <button class="btn-primary" style="background:#16a34a" onclick="xu_ly_phan_hoi_undo(true)">Đồng ý</button>
                <button class="btn-primary" style="background:#dc2626" onclick="xu_ly_phan_hoi_undo(false)">Từ chối</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2Q9kQMtdXu9D22yaNH618EbcIs2cNVGU",
            authDomain: "xogame-27755.firebaseapp.com",
            projectId: "xogame-27755",
            storageBucket: "xogame-27755.firebasestorage.app",
            messagingSenderId: "407277278988",
            appId: "1:407277278988:web:62872131b964dbfe289b29"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let user_id = null;
        let room_id = null;
        let is_host = false;
        let my_role = 'X'; 
        
        let cac_nuoc_di = {}; 
        let lich_su_nuoc_di = []; 
        let luot_choi = 'X';
        let nguoi_thang = null;
        let hang_thang = []; 
        let nuoc_di_cuoi = null;
        let so_lan_undo = { X: 3, O: 3 };
        
        // --- CAU HINH ---
        const PADDING = 3; // LE FREE 3 HANG
        let currentZoom = 40; // Pixel

        async function init() {
            setup_drag_and_zoom(); // Kich hoat chuc nang dieu khien
            
            try {
                await signInAnonymously(auth);
                user_id = auth.currentUser.uid;
                const btn = document.getElementById('btn_tao_phong');
                btn.textContent = "Tạo Phòng Online"; btn.disabled = false;
            } catch (error) {
                console.error(error); document.getElementById('btn_tao_phong').textContent = "Lỗi Kết Nối";
            }

            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                room_id = roomParam; is_host = false; my_role = 'O'; 
                document.getElementById('btn_tao_phong').style.display = 'none';
                lang_nghe_phong(room_id);
            } else {
                ve_ban_co();
            }
        }

        // --- DRAG & ZOOM LOGIC (QUAN TRONG) ---
        function setup_drag_and_zoom() {
            const container = document.getElementById('khung_ban_co');
            const hint = document.getElementById('hint_text');
            
            // 1. DRAG (Mouse & Touch)
            let isDown = false;
            let startX, startY, scrollLeft, scrollTop;

            const startDrag = (e) => {
                isDown = true;
                container.style.cursor = 'grabbing';
                hint.style.display = 'none'; // An huong dan khi bat dau tuong tac
                
                const pageX = e.pageX || e.touches[0].pageX;
                const pageY = e.pageY || e.touches[0].pageY;
                
                startX = pageX - container.offsetLeft;
                startY = pageY - container.offsetTop;
                scrollLeft = container.scrollLeft;
                scrollTop = container.scrollTop;
            };

            const endDrag = () => {
                isDown = false;
                container.style.cursor = 'grab';
            };

            const moveDrag = (e) => {
                if (!isDown) return;
                e.preventDefault();
                const pageX = e.pageX || e.touches[0].pageX;
                const pageY = e.pageY || e.touches[0].pageY;
                
                const x = pageX - container.offsetLeft;
                const y = pageY - container.offsetTop;
                const walkX = (x - startX) * 1; // Toc do keo
                const walkY = (y - startY) * 1;
                
                container.scrollLeft = scrollLeft - walkX;
                container.scrollTop = scrollTop - walkY;
            };

            // Events Mouse
            container.addEventListener('mousedown', startDrag);
            container.addEventListener('mouseleave', endDrag);
            container.addEventListener('mouseup', endDrag);
            container.addEventListener('mousemove', moveDrag);

            // Events Touch (1 ngon tay de keo)
            container.addEventListener('touchstart', (e) => {
                if(e.touches.length === 1) startDrag(e);
            });
            container.addEventListener('touchend', endDrag);
            container.addEventListener('touchmove', (e) => {
                if(e.touches.length === 1) moveDrag(e);
            });

            // 2. ZOOM (Wheel & Pinch)
            
            // Mouse Wheel
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = Math.sign(e.deltaY) * -5;
                updateZoom(delta);
            }, { passive: false });

            // Pinch Zoom (Mobile)
            let initialDistance = 0;
            
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    initialDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                }
            });

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault(); // Ngan zoom toan trang
                    const currentDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    
                    const delta = (currentDistance - initialDistance) * 0.1;
                    if (Math.abs(delta) > 1) { // Giam do nhay
                         updateZoom(delta);
                         initialDistance = currentDistance; // Reset de zoom muot hon
                    }
                }
            }, { passive: false });
        }

        function updateZoom(delta) {
            let newZoom = currentZoom + delta;
            if (newZoom < 15) newZoom = 15; // Min zoom
            if (newZoom > 100) newZoom = 100; // Max zoom
            
            currentZoom = newZoom;
            
            const root = document.documentElement;
            root.style.setProperty('--cell-size', `${currentZoom}px`);
            root.style.setProperty('--font-size', `${Math.max(currentZoom * 0.5, 10)}px`);
        }

        // --- CAC FUNCTION GAME GIU NGUYEN ---
        window.tao_phong_moi = async function() {
            if (!user_id) return;
            document.getElementById('btn_tao_phong').textContent = "Đang tạo...";
            room_id = Math.random().toString(36).substring(2, 8).toUpperCase();
            is_host = true; my_role = 'X';

            await setDoc(doc(db, 'games', room_id), {
                cac_nuoc_di: {}, lich_su_nuoc_di: [], luot_choi: 'X',
                nguoi_thang: null, hang_thang: [], 
                nguoi_tao: user_id, nguoi_tham_gia: null,
                nuoc_di_cuoi: null, so_lan_undo: { X: 3, O: 3 }, undo_request: null, ngay_tao: Date.now()
            });

            hien_thi_qr(room_id);
            lang_nghe_phong(room_id);
            document.getElementById('btn_tao_phong').style.display = 'none';
        }

        function hien_thi_qr(id) {
            const url = window.location.href.split('?')[0] + '?room=' + id;
            document.getElementById('anh_qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
            document.getElementById('link_phong').textContent = url;
            document.getElementById('modal_qr').style.display = 'flex';
        }

        window.dong_modal = (id) => document.getElementById(id).style.display = 'none';
        window.copy_link = () => { navigator.clipboard.writeText(document.getElementById('link_phong').textContent); alert("Đã copy!"); }

        function lang_nghe_phong(id) {
            onSnapshot(doc(db, 'games', id), (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();
                
                cac_nuoc_di = data.cac_nuoc_di || {};
                lich_su_nuoc_di = data.lich_su_nuoc_di || [];
                luot_choi = data.luot_choi;
                nguoi_thang = data.nguoi_thang;
                nuoc_di_cuoi = data.nuoc_di_cuoi;
                hang_thang = data.hang_thang || [];
                so_lan_undo = data.so_lan_undo || { X: 3, O: 3 };
                
                if (is_host && data.nguoi_tham_gia && document.getElementById('modal_qr').style.display === 'flex') {
                    dong_modal('modal_qr'); alert("Người chơi thứ 2 đã tham gia!");
                }
                if (!is_host && !data.nguoi_tham_gia && user_id) updateDoc(doc(db, 'games', id), { nguoi_tham_gia: user_id });

                if (data.undo_request) {
                    if (data.undo_request.status === 'pending' && data.undo_request.requester !== my_role) 
                        document.getElementById('modal_confirm_undo').style.display = 'flex';
                    else if (data.undo_request.status === 'accepted' && data.undo_request.requester === my_role) {
                        alert("Được đồng ý đi lại!"); updateDoc(doc(db, 'games', id), { undo_request: null });
                    } else if (data.undo_request.status === 'rejected' && data.undo_request.requester === my_role) {
                        alert("Bị từ chối!"); updateDoc(doc(db, 'games', id), { undo_request: null });
                    } else if (data.undo_request.requester !== my_role) {
                        document.getElementById('modal_confirm_undo').style.display = 'none';
                    }
                }

                cap_nhat_ui();
                ve_ban_co();
            });
        }

        async function gui_nuoc_di(h, c) {
            // Drag check: Neu dang drag thi khong tinh la click
            // (Duoc xu ly boi CSS pointer-events hoac check thoi gian click nhung o day ta dung onlick don gian)
            
            const id = `${h},${c}`;
            if (!room_id) { 
                cac_nuoc_di[id] = luot_choi;
                lich_su_nuoc_di.push({id, player: luot_choi});
                nuoc_di_cuoi = id;
                const thang = tinh_toan_thang(h, c, luot_choi, cac_nuoc_di);
                if (thang) { nguoi_thang = luot_choi; hang_thang = thang; }
                else luot_choi = (luot_choi === 'X' ? 'O' : 'X');
                ve_ban_co(); cap_nhat_ui(); return;
            }

            if (luot_choi !== my_role) return;

            cac_nuoc_di[id] = my_role; 
            nuoc_di_cuoi = id;
            const thang_cuc_bo = tinh_toan_thang(h, c, my_role, cac_nuoc_di);
            if (thang_cuc_bo) { nguoi_thang = my_role; hang_thang = thang_cuc_bo; }
            ve_ban_co(); 

            await updateDoc(doc(db, 'games', room_id), {
                cac_nuoc_di: cac_nuoc_di,
                lich_su_nuoc_di: [...lich_su_nuoc_di, { id, player: my_role }],
                luot_choi: thang_cuc_bo ? my_role : (my_role === 'X' ? 'O' : 'X'),
                nguoi_thang: thang_cuc_bo ? my_role : null,
                hang_thang: thang_cuc_bo || [],
                nuoc_di_cuoi: id,
                undo_request: null
            });
        }

        window.gui_yeu_cau_undo = async () => {
            if (so_lan_undo[my_role] <= 0 || !lich_su_nuoc_di.length) return;
            if (lich_su_nuoc_di[lich_su_nuoc_di.length-1].player !== my_role) { alert("Chỉ đi lại nước của BẠN!"); return; }
            document.getElementById('btn_undo').textContent = "Đang xin..."; 
            document.getElementById('btn_undo').disabled = true;
            await updateDoc(doc(db, 'games', room_id), { undo_request: { requester: my_role, status: 'pending' } });
        }

        window.xu_ly_phan_hoi_undo = async (dong_y) => {
            document.getElementById('modal_confirm_undo').style.display = 'none';
            if (!dong_y) {
                await updateDoc(doc(db, 'games', room_id), { 'undo_request.status': 'rejected' });
            } else {
                const snap = await getDoc(doc(db, 'games', room_id));
                const data = snap.data();
                const hist = data.lich_su_nuoc_di;
                const last = hist.pop();
                delete data.cac_nuoc_di[last.id];
                const prev = hist.length ? hist[hist.length-1].id : null;
                data.so_lan_undo[last.player]--;

                await updateDoc(doc(db, 'games', room_id), {
                    cac_nuoc_di: data.cac_nuoc_di, lich_su_nuoc_di: hist, nuoc_di_cuoi: prev,
                    luot_choi: last.player, nguoi_thang: null, hang_thang: [],
                    so_lan_undo: data.so_lan_undo, undo_request: { requester: last.player, status: 'accepted' }
                });
            }
        }

        window.xu_ly_choi_lai = async () => {
            let next_start = nguoi_thang === 'X' ? 'O' : (nguoi_thang === 'O' ? 'X' : 'X');
            if (room_id) {
                await updateDoc(doc(db, 'games', room_id), {
                    cac_nuoc_di: {}, lich_su_nuoc_di: [], luot_choi: next_start,
                    nguoi_thang: null, hang_thang: [], nuoc_di_cuoi: null,
                    so_lan_undo: {X:3, O:3}, undo_request: null
                });
            } else {
                cac_nuoc_di = {}; lich_su_nuoc_di = []; luot_choi = next_start;
                nguoi_thang = null; hang_thang = []; nuoc_di_cuoi = null; so_lan_undo = {X:3, O:3};
                cap_nhat_ui(); ve_ban_co();
            }
        }

        function tinh_toan_thang(h, c, player, board) {
             const dirs = [[0,1], [1,0], [1,1], [1,-1]];
             for (let [dh, dc] of dirs) {
                let line = [`${h},${c}`], count = 1;
                for (let k=1; k<5; k++) {
                    const id = `${h + dh*k},${c + dc*k}`;
                    if (board[id] === player) { count++; line.push(id); } else break;
                }
                for (let k=1; k<5; k++) {
                    const id = `${h - dh*k},${c - dc*k}`;
                    if (board[id] === player) { count++; line.push(id); } else break;
                }
                if (count >= 5) return line;
             }
             return null;
        }

        // --- RENDER VOI PADDING 3 ---
        function ve_ban_co() {
            const luoi = document.getElementById('luoi_co');
            const keys = Object.keys(cac_nuoc_di);
            
            // Xac dinh gioi han
            let min_h = 0, max_h = 0, min_c = 0, max_c = 0;
            if (keys.length > 0) {
                min_h = Infinity; max_h = -Infinity; min_c = Infinity; max_c = -Infinity;
                keys.forEach(k => {
                    const [h,c] = k.split(',').map(Number);
                    if(h<min_h) min_h=h; if(h>max_h) max_h=h;
                    if(c<min_c) min_c=c; if(c>max_c) max_c=c;
                });
            }
            
            // Mac dinh neu trong thi ve 15x15
            if (keys.length === 0) { min_h = -7; max_h = 7; min_c = -7; max_c = 7; }

            // Ap dung Padding 3
            const start_h = min_h - PADDING;
            const end_h = max_h + PADDING;
            const start_c = min_c - PADDING;
            const end_c = max_c + PADDING;

            const rows = end_h - start_h + 1;
            const cols = end_c - start_c + 1;

            luoi.style.gridTemplateColumns = `repeat(${cols}, auto)`;
            luoi.style.gridTemplateRows = `repeat(${rows}, auto)`;
            luoi.innerHTML = '';
            
            for (let h=start_h; h<=end_h; h++) {
                for (let c=start_c; c<=end_c; c++) {
                    const id = `${h},${c}`;
                    const div = document.createElement('div');
                    div.className = 'o_co';
                    
                    if (cac_nuoc_di[id]) {
                        div.textContent = cac_nuoc_di[id];
                        div.classList.add(cac_nuoc_di[id] === 'X' ? 'quan_x' : 'quan_o');
                    }
                    if (id === nuoc_di_cuoi) div.classList.add('o_vua_danh');
                    if (hang_thang.includes(id)) div.classList.add('o_thang');

                    div.onclick = () => { if(!nguoi_thang && !cac_nuoc_di[id]) gui_nuoc_di(h,c); };
                    luoi.appendChild(div);
                }
            }
        }

        function cap_nhat_ui() {
            const div = document.getElementById('trang_thai_luot');
            const btn_replay = document.getElementById('btn_choi_lai');
            const btn_undo = document.getElementById('btn_undo');
            
            if (nguoi_thang) {
                div.innerHTML = `<span class="vang" style="padding:4px 8px;border-radius:4px">CHIẾN THẮNG: ${nguoi_thang}</span>`;
                if (is_host || !room_id) btn_replay.style.display = 'block';
                btn_undo.style.display = 'none';
            } else {
                let html = `Lượt: <span class="luot_choi_hien_thi ${luot_choi==='X'?'do':'xanh'}">${luot_choi}</span>`;
                if (room_id) {
                    html += ` (Bạn: ${my_role})`;
                    if (luot_choi === my_role) html += ` <span class="den-luot-ban">ĐẾN LƯỢT BẠN!</span>`;
                    
                    btn_undo.style.display = 'block';
                    btn_undo.textContent = `Xin lại (${so_lan_undo[my_role]})`;
                    const canUndo = so_lan_undo[my_role] > 0 && lich_su_nuoc_di.length > 0 && lich_su_nuoc_di[lich_su_nuoc_di.length-1].player === my_role;
                    btn_undo.disabled = !canUndo;
                    if (document.getElementById('btn_undo').textContent === "Đang xin...") btn_undo.disabled = true;
                }
                div.innerHTML = html;
                btn_replay.style.display = 'none';
            }
        }

        window.addEventListener('resize', ve_ban_co);
        init();
    </script>
</body>
</html>
