<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XO Online - Fix Tương Tác</title>
    <style>
        /* (Giữ nguyên phần CSS từ bản trước của bạn) */
        :root { --cell-size: 40px; --font-size: 20px; --paper-bg: #ffffff; --grid-line: #cbd5e1; --text-color: #1e293b; }
        body { margin: 0; padding: 0; background-color: #f1f5f9; color: var(--text-color); font-family: ui-sans-serif, system-ui, sans-serif; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
        #thong_tin { flex: 0 0 auto; padding: 0.5rem; background-color: #1e293b; color: #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); z-index: 100; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
        .left-info { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        h1 { margin: 0; font-size: 1rem; font-weight: bold; color: #facc15; white-space: nowrap; }
        .bang_dieu_khien { display: flex; gap: 5px; align-items: center; overflow-x: auto; max-width: 100%; padding-bottom: 2px; }
        .luot_choi_hien_thi { padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; white-space: nowrap; }
        .xanh { background-color: #3b82f6; color: white; }
        .do { background-color: #ef4444; color: white; }
        .vang { background-color: #facc15; color: black; }
        button { background-color: #334155; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 0.8rem; white-space: nowrap; }
        .stats-badge { color: #94a3b8; font-size: 0.75rem; display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 10px; }
        #khung_ban_co { flex: 1; position: relative; overflow: hidden; background-color: #f8fafc; cursor: grab; touch-action: none; z-index: 10; }
        .cursor-grabbing { cursor: grabbing !important; }
        #luoi_co { position: absolute; display: grid; background-color: transparent; border-top: 1px solid var(--grid-line); border-left: 1px solid var(--grid-line); grid-auto-rows: var(--cell-size); grid-auto-columns: var(--cell-size); pointer-events: none; transition: left 0.05s, top 0.05s; }
        .o_co { background-color: var(--paper-bg); display: flex; justify-content: center; align-items: center; font-weight: bold; position: relative; width: var(--cell-size); height: var(--cell-size); box-sizing: border-box; font-size: var(--font-size); border-right: 1px solid var(--grid-line); border-bottom: 1px solid var(--grid-line); }
        .quan_x { color: #ef4444; } .quan_o { color: #3b82f6; }
        .o_vua_danh::after { content: ''; position: absolute; inset: 0; background-color: rgba(56, 189, 248, 0.2); }
        .o_goi_y { background-color: rgba(139, 92, 246, 0.15) !important; }
        .badge_goi_y { position: absolute; top: 2px; right: 2px; background: #7c3aed; color: white; font-size: 0.6rem; width: 14px; height: 14px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        #nut_mo_chat { position: fixed; bottom: 80px; right: 20px; width: 45px; height: 45px; border-radius: 50%; background-color: #2563eb; color: white; display: none; justify-content: center; align-items: center; font-size: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer; z-index: 200; border: none; }
        #khung_chat { position: fixed; bottom: 80px; right: 20px; width: 300px; height: 400px; background-color: #1e293b; color: white; border-radius: 8px; display: none; flex-direction: column; z-index: 210; border: 1px solid #334155; }
        .modal_overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 500; }
        .modal_content { background: #1e293b; color: white; padding: 1.5rem; border-radius: 0.5rem; text-align: center; width: 350px; }
        .lobby-search { margin-bottom: 10px; width: 100%; padding: 8px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 4px; }
        .lobby-list { max-height: 50vh; overflow-y: auto; margin-top: 10px; border: 1px solid #334155; border-radius: 4px; }
        .room-item { padding: 10px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; background: #0f172a; }
        #ban_quyen { padding: 5px; text-align: center; font-size: 0.7rem; color: #64748b; background-color: #f1f5f9; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body onmousedown="ngan_chan_loang_tin(event)" ontouchstart="ngan_chan_loang_tin(event)">

    <div id="thong_tin" onmousedown="chan_su_kien(event)" ontouchstart="chan_su_kien(event)">
        <div class="left-info">
            <h1 id="ten_phong_header">XO Online <span id="icon_team">💡</span></h1>
            <div id="trang_thai_luot">
                <span id="hien_thi_luot" class="luot_choi_hien_thi do">...</span>
            </div>
        </div>
        <div class="bang_dieu_khien">
            <span id="thong_so_phong" class="stats-badge" style="display:none;"></span>
            <button id="btn_copy_id" onclick="copy_room_id()" class="btn-primary" style="display:none;">Chép ID</button>
            <button id="btn_toggle_team" onclick="bat_tat_team_mode()" class="btn-team" style="display:none;">Bật Gợi Ý</button>
            <button id="btn_lobby" onclick="mo_lobby()" class="btn-success">Danh Sách</button>
            <button id="btn_roi_phong" onclick="roi_phong(true)" class="btn-danger" style="display:none;">Thoát</button>
            <button id="btn_undo" onclick="gui_yeu_cau_undo()" class="btn-warning" style="display:none;">Xin Lại</button>
            <button id="btn_choi_lai" onclick="kich_hoat_choi_lai()" class="btn-primary" style="display:none;">Ván Mới</button>
            <button id="btn_mo_tao_phong" onclick="mo_modal_tao_phong()" class="btn-primary">Tạo Phòng</button>
        </div>
    </div>

    <div id="khung_ban_co">
        <div id="luoi_co"></div>
    </div>

    <button id="nut_mo_chat" onclick="bat_tat_chat()" onmousedown="chan_su_kien(event)" ontouchstart="chan_su_kien(event)">💬<div id="thong_bao_tin_moi">!</div></button>

    <div id="khung_chat" onmousedown="chan_su_kien(event)" ontouchstart="chan_su_kien(event)">
        <div class="chat-header"><span>Phòng Chat</span><button onclick="bat_tat_chat()">✖</button></div>
        <div id="noi_dung_chat" class="chat-body"></div>
        <div class="chat-footer">
            <input type="text" id="chat_input" placeholder="Nhập tin nhắn..." onkeypress="xu_ly_enter(event)">
            <button onclick="gui_tin_nhan()">Gửi</button>
        </div>
    </div>

    <div id="ban_quyen">Trần Hồng Dân - tranhongdan@tranphudlk.edu.vn</div>

    <div id="modal_tao_phong" class="modal_overlay" onmousedown="chan_su_kien(event)" ontouchstart="chan_su_kien(event)">
        <div class="modal_content">
            <h2>Tạo Phòng Mới</h2>
            <input type="text" id="input_ten_phong" class="lobby-search" placeholder="Tên phòng..." maxlength="20">
            <div class="modal_actions">
                <button onclick="tao_phong_moi()" class="btn-primary">Tạo</button>
                <button onclick="dong_modal('modal_tao_phong')">Hủy</button>
            </div>
        </div>
    </div>

    <div id="modal_lobby" class="modal_overlay" onmousedown="chan_su_kien(event)" ontouchstart="chan_su_kien(event)">
        <div class="modal_content" style="width: 450px;">
            <h2>Danh Sách Phòng</h2>
            <input type="text" id="lobby_search_input" class="lobby-search" placeholder="Tìm phòng..." oninput="filter_lobby()">
            <div id="danh_sach_phong" class="lobby-list"></div>
            <div class="modal_actions"><button onclick="dong_modal('modal_lobby')">Đóng</button></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, collection, query, orderBy, limit, getDocs, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyA2Q9kQMtdXu9D22yaNH618EbcIs2cNVGU", authDomain: "xogame-27755.firebaseapp.com", projectId: "xogame-27755", storageBucket: "xogame-27755.firebasestorage.app", messagingSenderId: "407277278988", appId: "1:407277278988:web:62872131b964dbfe289b29" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- VARS ---
        let user_id = null, room_id = null, is_host = false, my_role = 'X', unsubscribe = null;
        let cac_nuoc_di = {}, lich_su_nuoc_di = [], luot_choi = 'X', nguoi_thang = null, ten_phong = "XO Online";
        let currentZoom = 40, viewOffsetX = 0, viewOffsetY = 0;
        let team_mode = { X: false, O: false }, cac_goi_y = { X: {}, O: {} };

        // --- HAM CHAN SU KIEN ---
        window.chan_su_kien = (e) => {
            e.stopPropagation(); // Ngăn sự kiện chạm lan xuống bàn cờ
        };

        async function init() {
            const container = document.getElementById('khung_ban_co');
            viewOffsetX = container.clientWidth / 2; viewOffsetY = container.clientHeight / 2;
            ve_ban_co(); cap_nhat_ui(); setup_interaction(); update_view_transform();
            try { await signInAnonymously(auth); user_id = auth.currentUser.uid; } catch (e) { alert("Lỗi kết nối!"); }
        }

        function setup_interaction() {
            const container = document.getElementById('khung_ban_co');
            let isDragging = false, startX, startY, didMove = false;

            const onPointerDown = (e) => {
                // Chỉ xử lý nếu điểm chạm nằm trực tiếp trên khung_ban_co hoặc lưới cờ
                if (e.target.closest('#thong_tin') || e.target.closest('#khung_chat') || e.target.closest('.modal_overlay')) return;
                
                isDragging = true; didMove = false;
                container.classList.add('cursor-grabbing');
                const pageX = e.pageX || e.touches[0].pageX;
                const pageY = e.pageY || e.touches[0].pageY;
                startX = pageX; startY = pageY;
            };

            const onPointerMove = (e) => {
                if (!isDragging) return;
                const pageX = e.pageX || (e.touches ? e.touches[0].pageX : 0);
                const pageY = e.pageY || (e.touches ? e.touches[0].pageY : 0);
                const dx = pageX - startX; const dy = pageY - startY;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) didMove = true;
                viewOffsetX += dx; viewOffsetY += dy;
                startX = pageX; startY = pageY;
                update_view_transform();
            };

            const onPointerUp = (e) => {
                if (!isDragging) return;
                isDragging = false;
                container.classList.remove('cursor-grabbing');
                if (!didMove) {
                    let clientX, clientY;
                    if (e.changedTouches) { clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; } 
                    else { clientX = e.clientX; clientY = e.clientY; }
                    
                    const rect = container.getBoundingClientRect();
                    const c = Math.floor((clientX - rect.left - viewOffsetX) / currentZoom);
                    const h = Math.floor((clientY - rect.top - viewOffsetY) / currentZoom);
                    xu_ly_click_o_co(h, c);
                }
            };

            container.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            container.addEventListener('touchstart', onPointerDown, { passive: false });
            container.addEventListener('touchmove', onPointerMove, { passive: false });
            container.addEventListener('touchend', onPointerUp);
        }

        // --- CÁC HÀM LOGIC KHÁC (Giữ nguyên từ bản trước của bạn) ---
        window.mo_modal_tao_phong = () => { document.getElementById('modal_tao_phong').style.display = 'flex'; };
        window.dong_modal = (id) => { document.getElementById(id).style.display = 'none'; };

        function update_view_transform() {
            const luoi = document.getElementById('luoi_co');
            const minH = parseInt(luoi.dataset.minH || 0); const minC = parseInt(luoi.dataset.minC || 0);
            luoi.style.left = `${viewOffsetX + minC * currentZoom}px`;
            luoi.style.top = `${viewOffsetY + minH * currentZoom}px`;
            document.documentElement.style.setProperty('--cell-size', `${currentZoom}px`);
        }

        function xu_ly_click_o_co(h, c) {
            const id = `${h},${c}`;
            if (cac_nuoc_di[id] || nguoi_thang) return;
            if (my_role === 'SPECTATOR') {
                if (team_mode[luot_choi]) gui_goi_y(id);
                return;
            }
            if (room_id && luot_choi !== my_role) return;
            gui_nuoc_di(h, c);
        }

        async function gui_nuoc_di(h, c) {
            const id = `${h},${c}`;
            // Logic gửi nước đi lên Firebase giống như bản trước...
            console.log("Đặt quân tại:", id);
        }

        // Các hàm ve_ban_co, cap_nhat_ui, lang_nghe_phong... giữ nguyên logic hiển thị tiếng Việt có dấu.

        init();
    </script>
</body>
</html>
