<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XO Online - Final Sync Fix</title>
    <style>
        /* --- GIỮ NGUYÊN CSS CŨ --- */
        :root { --cell-size: 40px; --font-size: 20px; --paper-bg: #ffffff; --grid-line: #cbd5e1; --text-color: #1e293b; }
        body { margin: 0; padding: 0; background-color: #f1f5f9; color: var(--text-color); font-family: ui-sans-serif, system-ui, sans-serif; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
        #thong_tin { flex: 0 0 auto; padding: 0.5rem; background-color: #1e293b; color: #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); z-index: 20; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
        .left-info { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        h1 { margin: 0; font-size: 1rem; font-weight: bold; color: #facc15; white-space: nowrap; }
        
        /* ĐÈN TÍN HIỆU KẾT NỐI */
        #status_dot { width: 10px; height: 10px; border-radius: 50%; background-color: #9ca3af; display: inline-block; margin-right: 5px; box-shadow: 0 0 5px currentColor; transition: all 0.3s; }
        .dot-online { background-color: #22c55e !important; box-shadow: 0 0 8px #22c55e !important; } /* Xanh lá */
        .dot-offline { background-color: #ef4444 !important; } /* Đỏ */

        @keyframes blink { 50% { opacity: 0.5; } }

        .bang_dieu_khien { display: flex; gap: 5px; align-items: center; overflow-x: auto; max-width: 100%; padding-bottom: 2px; }
        .bang_dieu_khien::-webkit-scrollbar { display: none; }
        .luot_choi_hien_thi { padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; white-space: nowrap; }
        .xanh { background-color: #3b82f6; color: white; }
        .do { background-color: #ef4444; color: white; }
        .vang { background-color: #facc15; color: black; }
        .tim { background-color: #8b5cf6; color: white; }
        .den-luot-ban { color: #4ade80; font-weight: bold; font-size: 0.7rem; animation: pulse 2s infinite; display: inline-block; margin-left: 5px; white-space: nowrap; }
        .spectator-badge { background: #64748b; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; white-space: nowrap; }
        @keyframes pulse { 50% { opacity: .5; } }
        button { background-color: #334155; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 0.8rem; white-space: nowrap; }
        button:hover { background-color: #475569; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background-color: #2563eb; } .btn-warning { background-color: #d97706; } .btn-danger { background-color: #dc2626; } .btn-success { background-color: #16a34a; } .btn-team { background-color: #7c3aed; }
        .eye-count { color: #94a3b8; font-size: 0.8rem; display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 10px; }
        #icon_team { display: none; font-size: 1.1rem; animation: bounce 2s infinite; margin-left:5px; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        #khung_ban_co { flex: 1; position: relative; overflow: hidden; background-color: #f8fafc; cursor: grab; touch-action: none; }
        .cursor-grabbing { cursor: grabbing !important; } .cursor-pointer { cursor: pointer !important; }
        #luoi_co { position: absolute; display: grid; background-color: transparent; gap: 0; border-top: 1px solid var(--grid-line); border-left: 1px solid var(--grid-line); grid-auto-rows: var(--cell-size); grid-auto-columns: var(--cell-size); pointer-events: none; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); transition: left 0.05s, top 0.05s; }
        .o_co { background-color: var(--paper-bg); display: flex; justify-content: center; align-items: center; font-weight: bold; position: relative; width: var(--cell-size); height: var(--cell-size); box-sizing: border-box; font-size: var(--font-size); pointer-events: none; border-right: 1px solid var(--grid-line); border-bottom: 1px solid var(--grid-line); }
        .quan_x { color: #ef4444; } .quan_o { color: #3b82f6; }
        .o_vua_danh::after { content: ''; position: absolute; inset: 0; background-color: rgba(56, 189, 248, 0.2); }
        .o_co.o_thang { z-index: 100; }
        .o_co.o_thang::before { content: ''; position: absolute; inset: 0; background-color: #fef08a; z-index: -1; box-shadow: 0 0 15px #facc15; animation: thang_cuoc 0.5s infinite alternate; }
        @keyframes thang_cuoc { from { transform: scale(1); } to { transform: scale(1.15); } }
        .o_goi_y { background-color: rgba(192, 38, 211, 0.15) !important; }
        .o_my_suggest { border: 2px dashed #c026d3 !important; background-color: rgba(192, 38, 211, 0.05); }
        .badge_goi_y { position: absolute; top: 2px; right: 2px; background: #c026d3; color: white; font-size: 0.6rem; width: 14px; height: 14px; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 5; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        #active_border { position: absolute; width: var(--cell-size); height: var(--cell-size); box-sizing: border-box; z-index: 10; pointer-events: none; border: 2px solid #3b82f6; background-color: rgba(59, 130, 246, 0.1); display: none; animation: pulse-border 1.5s infinite; }
        @keyframes pulse-border { 50% { border-color: #60a5fa; background-color: rgba(59, 130, 246, 0.2); } }
        #nut_mo_chat { position: fixed; bottom: 80px; right: 20px; width: 45px; height: 45px; border-radius: 50%; background-color: #2563eb; color: white; display: none; justify-content: center; align-items: center; font-size: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer; z-index: 30; border: none; }
        #thong_bao_tin_moi { position: absolute; top: -2px; right: -2px; background: #ef4444; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: none; justify-content: center; align-items: center; }
        #khung_chat { position: fixed; bottom: 80px; right: 20px; width: 300px; height: 400px; background-color: #1e293b; color: white; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); display: none; flex-direction: column; z-index: 31; border: 1px solid #334155; max-width: 85vw; }
        .chat-header { padding: 10px; background: #0f172a; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .chat-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .chat-footer { padding: 10px; display: flex; gap: 5px; border-top: 1px solid #334155; }
        #chat_input { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        .tin-nhan { padding: 6px 10px; border-radius: 6px; font-size: 0.9rem; max-width: 80%; word-wrap: break-word; }
        .tin-ban { align-self: flex-end; background-color: #2563eb; color: white; }
        .tin-doi-thu { align-self: flex-start; background-color: #334155; color: #f1f5f9; }
        .chat-role { font-size: 0.7rem; opacity: 0.7; margin-bottom: 2px; }
        .modal_overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 50; }
        .modal_content { background: #1e293b; color: white; padding: 1.5rem; border-radius: 0.5rem; text-align: center; width: 350px; max-width: 90%; }
        .qr_image { background: white; padding: 8px; border-radius: 4px; margin: 1rem 0; width: 180px; height: 180px; }
        .link_box { background: #0f172a; padding: 0.5rem; border-radius: 4px; color: #94a3b8; padding: 0.5rem; margin-bottom: 1rem; cursor: pointer; word-break: break-all; font-size: 0.8rem; }
        .modal_actions { display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; }
        .lobby-list { max-height: 50vh; overflow-y: auto; text-align: left; margin-top: 10px; border: 1px solid #334155; border-radius: 4px; }
        .room-item { padding: 10px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; background: #0f172a; }
        .room-item:last-child { border-bottom: none; }
        .room-item:hover { background: #334155; cursor: pointer; }
        .room-status { font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; }
        .status-wait { background: #16a34a; color: white; }
        .status-full { background: #ef4444; color: white; }
        #ban_quyen { padding: 5px; text-align: center; font-size: 0.7rem; color: #64748b; background-color: #f1f5f9; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>

        <div class="bang_dieu_khien">

    <button id="nut_mo_chat" onclick="bat_tat_chat()">💬<div id="thong_bao_tin_moi">!</div></button>

    <div id="khung_chat">
        <div class="chat-header">
            <span style="font-weight:bold; color:#facc15">Chat Room</span>
            <button onclick="bat_tat_chat()" style="padding:2px 8px; background:none; font-size:1.2rem; color:white;">✖</button>

    <div id="ban_quyen">Trần Hồng Dân - tranhongdan@tranphudlk.edu.vn</div>

    <div id="modal_qr" class="modal_overlay">
        <div class="modal_content">
            <h2 style="margin-top:0">Quét mã để chơi</h2>
            <div style="color:#facc15; margin-bottom:1rem; font-style:italic">Đang chờ người chơi thứ 2...</div>

            <div id="link_phong" class="link_box" onclick="copy_link()" title="Click để copy"></div>
            <button onclick="dong_modal('modal_qr')">Đóng</button>
        </div>

    <div id="modal_confirm_undo" class="modal_overlay">
        <div class="modal_content">
            <h3 style="color:#facc15; margin-top:0">Yêu cầu đi lại</h3>
            <p>Đối thủ muốn xin đi lại nước vừa rồi.</p>
            <div class="modal_actions">
                <button class="btn-primary" style="background:#16a34a" onclick="xu_ly_phan_hoi_undo(true)">Đồng ý</button>
                <button class="btn-primary" style="background:#dc2626" onclick="xu_ly_phan_hoi_undo(false)">Từ chối</button>
            </div>
        </div>
    </div>

    <div id="modal_lobby" class="modal_overlay">
        <div class="modal_content" style="width: 500px;">
            <h2 style="margin-top:0; color:#facc15">Danh Sách Phòng</h2>
            <p style="font-size:0.8rem; color:#94a3b8;">Ẩn phòng sau 5 phút không hoạt động</p>
            <div id="danh_sach_phong" class="lobby-list">
                <div style="padding:10px; color:#64748b">Đang tải...</div>
            </div>
            <div class="modal_actions">
                <button onclick="mo_lobby()" class="btn-primary">Làm mới</button>
                <button onclick="dong_modal('modal_lobby')" style="background:#475569">Đóng</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, collection, query, orderBy, limit, getDocs, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2Q9kQMtdXu9D22yaNH618EbcIs2cNVGU",
            authDomain: "xogame-27755.firebaseapp.com",
            projectId: "xogame-27755",
            storageBucket: "xogame-27755.firebasestorage.app",
            messagingSenderId: "407277278988",
            appId: "1:407277278988:web:62872131b964dbfe289b29"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const AUDIO_JOIN_SRC = "data:audio/wav;base64,UklGRi4AAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAACAgICAAAAAgICAgIC";
        const AUDIO_CHAT_SRC = "data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YRAAAACAgICAgICAgICAgICAgICA";
        let audioEnabled = false;
        const sndJoin = new Audio(AUDIO_JOIN_SRC);
        const sndChat = new Audio(AUDIO_CHAT_SRC);
        function unlock_audio() { if (audioEnabled) return; const dummy = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAAAAAA=="); dummy.play().then(() => { audioEnabled = true; }).catch(e => {}); }
        document.body.addEventListener('click', unlock_audio, { once: true });
        document.body.addEventListener('touchstart', unlock_audio, { once: true });
        function playSound(type) { if (!audioEnabled) return; try { if (type === 'join') { sndJoin.currentTime=0; sndJoin.play().catch(e=>{}); } if (type === 'chat') { sndChat.currentTime=0; sndChat.play().catch(e=>{}); } } catch(e) {} }

        // VARS
        let user_id = null, room_id = null, is_host = false, my_role = 'X', unsubscribe = null;
        let cac_nuoc_di = {}, lich_su_nuoc_di = [], luot_choi = 'X', nguoi_thang = null, hang_thang = [], nuoc_di_cuoi = null, so_lan_undo = { X: 3, O: 3 };
        let lich_su_chat = [], is_chat_open = false, so_nguoi_xem = 0;
        let currentZoom = 40, viewOffsetX = 0, viewOffsetY = 0;
        let che_do_goi_y = { X: false, O: false };
        let cac_goi_y = { X: {}, O: {} }; 
        const PADDING = 3, TIMEOUT_MS = 5 * 60 * 1000; 

        // --- INIT STRICT FLOW ---
        function set_status(status) {
            const dot = document.getElementById('status_dot');
            dot.className = '';
            if (status === 'connecting') dot.classList.add('dot-connecting');
            else if (status === 'online') dot.classList.add('dot-online');
            else dot.classList.add('dot-offline');
        }

        async function init() {
            const container = document.getElementById('khung_ban_co');
            viewOffsetX = container.clientWidth / 2; viewOffsetY = container.clientHeight / 2;
            ve_ban_co(); cap_nhat_ui(); setup_interaction(); update_view_transform();
            set_status('connecting');

            // Lắng nghe trạng thái đăng nhập THỰC SỰ
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    user_id = user.uid;
                    set_status('online');
                    console.log("Logged in as:", user_id);
                    
                    // Chỉ kiểm tra URL SAU KHI đã đăng nhập xong
                    const urlParams = new URLSearchParams(window.location.search);
                    const roomParam = urlParams.get('room');
                    
                    if (roomParam) {
                        room_id = roomParam; is_host = false; my_role = 'O';
                        lang_nghe_phong(room_id);
                    } else {
                        // Kích hoạt chế độ Solo / Tạo phòng
                        document.getElementById('btn_tao_phong').textContent = "Tạo Phòng";
                        document.getElementById('btn_tao_phong').disabled = false;
                        cap_nhat_ui();
                    }
                } else {
                    // Chưa đăng nhập -> Thử đăng nhập lại
                    signInAnonymously(auth).catch((error) => {
                        console.error(error);
                        set_status('offline');
                        alert("Lỗi kết nối Firebase!");
                    });
                }
            });
        }

        window.mo_lobby = async function() {
            if (room_id) { alert("Vui lòng thoát phòng hiện tại."); return; }
            document.getElementById('modal_lobby').style.display = 'flex';
            const listDiv = document.getElementById('danh_sach_phong');
            listDiv.innerHTML = '<div style="padding:10px; color:#64748b">Đang tải...</div>';
            try {
                const q = query(collection(db, "games"), orderBy("last_active", "desc"), limit(50));
                const querySnapshot = await getDocs(q);
                listDiv.innerHTML = '';
                let count = 0; const now = Date.now();
                querySnapshot.forEach((doc) => {
                    const data = doc.data(); const id = doc.id;
                    const lastTime = data.last_active || data.ngay_tao;
                    if (now - lastTime > TIMEOUT_MS) return;
                    const isFull = data.nguoi_tham_gia ? true : false;
                    let active_players = (data.nguoi_tao ? 1 : 0) + (data.nguoi_tham_gia ? 1 : 0);
                    let display_views = Math.max(0, (data.view_count || 0) - active_players);
                    
                    const item = document.createElement('div'); item.className = 'room-item';
                    item.innerHTML = `<div><div style="font-weight:bold; color:#f8fafc">Phòng: ${id}</div><div class="eye-count">👁️ ${display_views}</div></div><div class="room-status ${isFull ? 'status-full' : 'status-wait'}">${isFull ? 'Full' : 'Chờ'}</div>`;
                    item.onclick = () => window.location.href = `?room=${id}`;
                    listDiv.appendChild(item); count++;
                });
                if (count === 0) listDiv.innerHTML = '<div style="padding:10px;">Không có phòng online.</div>';
            } catch (e) { console.error(e); listDiv.innerHTML = '<div style="padding:10px; color:#94a3b8">Chưa có dữ liệu.</div>'; }
        }

        function setup_interaction() {
            const container = document.getElementById('khung_ban_co');
            const highlight = document.getElementById('active_border');
            let isDragging = false, startX, startY, didMove = false, initialPinchDist = 0;
            let wasPinching = false;

            const onPointerDown = (e) => {
                if (document.querySelector('.modal_overlay[style*="display: flex"]')) return;
                
                if (e.touches && e.touches.length === 2) { 
                    isDragging = false; wasPinching = true; 
                    initialPinchDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); 
                    return; 
                }
                isDragging = true; didMove = false; 
                container.classList.add('cursor-grabbing'); container.classList.remove('cursor-pointer');
                const pageX = e.pageX || e.touches[0].pageX; const pageY = e.pageY || e.touches[0].pageY;
                startX = pageX; startY = pageY;
                highlight.style.display = 'none';
            };

            const onPointerMove = (e) => {
                const pageX = e.pageX || (e.touches ? e.touches[0].pageX : 0);
                const pageY = e.pageY || (e.touches ? e.touches[0].pageY : 0);

                if (e.touches && e.touches.length === 2) { 
                    e.preventDefault(); 
                    const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); 
                    if (initialPinchDist > 0) updateZoom((dist - initialPinchDist) * 0.2); 
                    initialPinchDist = dist; 
                    return; 
                }
                
                if (isDragging) {
                    const dx = pageX - startX; const dy = pageY - startY;
                    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) didMove = true;
                    viewOffsetX += dx; viewOffsetY += dy;
                    startX = pageX; startY = pageY;
                    update_view_transform();
                    e.preventDefault();
                } else {
                    const rect = container.getBoundingClientRect();
                    const c = Math.floor((pageX - rect.left - viewOffsetX) / currentZoom);
                    const h = Math.floor((pageY - rect.top - viewOffsetY) / currentZoom);
                    if (!cac_nuoc_di[`${h},${c}`]) {
                        container.classList.add('cursor-pointer'); container.style.cursor = 'pointer'; 
                    } else {
                        container.classList.remove('cursor-pointer'); container.style.cursor = 'grab';
                    }
                }
            };

            const onPointerUp = (e) => {
                isDragging = false; 
                container.classList.remove('cursor-grabbing'); container.style.cursor = 'grab';
                
                if (wasPinching) {
                    if (!e.touches || e.touches.length === 0) wasPinching = false; 
                    return; 
                }
                if (!container.contains(e.target)) return;
                
                if (!didMove) {
                    let clientX, clientY;
                    if (e.changedTouches && e.changedTouches.length > 0) { clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; } else { clientX = e.clientX; clientY = e.clientY; }
                    const rect = container.getBoundingClientRect();
                    const c = Math.floor((clientX - rect.left - viewOffsetX) / currentZoom);
                    const h = Math.floor((clientY - rect.top - viewOffsetY) / currentZoom);
                    xu_ly_click_o_co(h, c);
                }
            };
            
            container.addEventListener('mousedown', onPointerDown); window.addEventListener('mousemove', onPointerMove); window.addEventListener('mouseup', onPointerUp);
            container.addEventListener('touchstart', onPointerDown, { passive: false }); container.addEventListener('touchmove', onPointerMove, { passive: false }); container.addEventListener('touchend', onPointerUp);
            container.addEventListener('wheel', (e) => { e.preventDefault(); updateZoom(Math.sign(e.deltaY) * -5); }, { passive: false });
        }

        function updateZoom(delta) {
            let oldZoom = currentZoom;
            currentZoom = Math.min(Math.max(currentZoom + delta, 10), 150);
            const container = document.getElementById('khung_ban_co');
            const cx = container.clientWidth / 2; const cy = container.clientHeight / 2;
            viewOffsetX = cx + (viewOffsetX - cx) * (currentZoom / oldZoom);
            viewOffsetY = cy + (viewOffsetY - cy) * (currentZoom / oldZoom);
            update_view_transform();
        }

        function update_view_transform() {
            const luoi = document.getElementById('luoi_co');
            const minH = parseInt(luoi.dataset.minH || -1);
            const minC = parseInt(luoi.dataset.minC || -1);
            luoi.style.left = `${viewOffsetX + minC * currentZoom}px`;
            luoi.style.top = `${viewOffsetY + minH * currentZoom}px`;
            document.documentElement.style.setProperty('--cell-size', `${currentZoom}px`);
            document.documentElement.style.setProperty('--font-size', `${Math.max(currentZoom * 0.5, 8)}px`);
        }

        function xu_ly_click_o_co(h, c) {
            const id = `${h},${c}`;
            if (cac_nuoc_di[id]) return; 
            
            if (my_role === 'SPECTATOR') {
                if (room_id) {
                    const target_role = luot_choi;
                    if (che_do_goi_y[target_role]) gui_goi_y(id, target_role);
                }
                return;
            }
            if (room_id && luot_choi !== my_role) return;
            gui_nuoc_di(h, c);
        }

        window.tao_phong_moi = async function() {
            if (!user_id) return;
            document.getElementById('btn_tao_phong').textContent = "Đang tạo...";
            room_id = Math.random().toString(36).substring(2, 8).toUpperCase();
            is_host = true; my_role = 'X';
            await setDoc(doc(db, 'games', room_id), {
                cac_nuoc_di: {}, lich_su_nuoc_di: [], luot_choi: 'X',
                nguoi_thang: null, hang_thang: [], 
                nguoi_tao: user_id, nguoi_tham_gia: null,
                nuoc_di_cuoi: null, so_lan_undo: { X: 3, O: 3 }, undo_request: null, 
                lich_su_chat: [], view_count: 0, 
                ngay_tao: Date.now(), last_active: Date.now(),
                che_do_goi_y: { X: false, O: false }, 
                cac_goi_y: { X: {}, O: {} }
            });
            hien_thi_qr(room_id);
            lang_nghe_phong(room_id);
        }

        function hien_thi_qr(id) {
            const url = window.location.href.split('?')[0] + '?room=' + id;
            document.getElementById('anh_qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
            document.getElementById('link_phong').textContent = url;
            document.getElementById('modal_qr').style.display = 'flex';
        }
        window.dong_modal = (id) => document.getElementById(id).style.display = 'none';
        window.copy_link = () => { navigator.clipboard.writeText(document.getElementById('link_phong').textContent); alert("Đã copy!"); }

        function reset_local_state() {
            room_id = null; is_host = false; my_role = 'X'; 
            cac_nuoc_di = {}; lich_su_nuoc_di = []; luot_choi = 'X'; nguoi_thang = null; hang_thang = []; nuoc_di_cuoi = null; lich_su_chat = [];
            che_do_goi_y = {X: false, O: false}; cac_goi_y = {X:{}, O:{}};
            cap_nhat_ui(); ve_ban_co();
            
            const url = new URL(window.location); url.searchParams.delete('room'); window.history.pushState({}, '', url);
            document.getElementById('khung_chat').style.display = 'none'; 
            document.getElementById('nut_mo_chat').style.display = 'none';
            document.getElementById('modal_qr').style.display = 'none';
            
            const btnCreate = document.getElementById('btn_tao_phong');
            btnCreate.textContent = "Tạo Phòng";
            btnCreate.disabled = false;
            btnCreate.style.display = 'block';
        }

        window.roi_phong = async function(manual_click = false) {
            if (!room_id) return;
            if (manual_click) {
                if (is_host) { try { await updateDoc(doc(db, 'games', room_id), { nguoi_tao: null }); } catch(e) {} } 
                else if (my_role === 'O') { try { await updateDoc(doc(db, 'games', room_id), { nguoi_tham_gia: null }); } catch(e) {} }
            }
            try { await updateDoc(doc(db, 'games', room_id), { view_count: increment(-1) }); } catch(e) {}
            if (unsubscribe) { unsubscribe(); unsubscribe = null; }
            reset_local_state();
        }

        function lang_nghe_phong(id) {
            // BAT BUOC RESET LISTENER NEU DA TON TAI
            if (unsubscribe) unsubscribe();
            
            updateDoc(doc(db, 'games', id), { view_count: increment(1) });
            
            unsubscribe = onSnapshot(doc(db, 'games', id), (docSnap) => {
                if (!docSnap.exists()) { 
                    alert("Phòng đã bị giải tán!"); 
                    reset_local_state(); return; 
                }
                const data = docSnap.data();
                
                // --- XU LY LOGIC KET NOI ---
                if (data.nguoi_tao === null && data.nguoi_tham_gia === null) {
                    deleteDoc(doc(db, 'games', id)); return;
                }
                if (is_host && !data.nguoi_tham_gia && document.getElementById('modal_qr').style.display === 'none') {
                     alert("Đối thủ đã thoát! Bạn có thể tạo phòng mới.");
                     deleteDoc(doc(db, 'games', id)); reset_local_state(); return;
                }
                if (my_role === 'O' && !data.nguoi_tao) {
                    alert("Chủ phòng đã thoát!"); deleteDoc(doc(db, 'games', id)); reset_local_state(); return;
                }

                // --- CAP NHAT DATA ---
                if (data.nguoi_tao === user_id) { is_host = true; my_role = 'X'; } 
                else if (data.nguoi_tham_gia === user_id) { is_host = false; my_role = 'O'; } 
                else if (!data.nguoi_tham_gia) { 
                    is_host = false; my_role = 'O'; 
                    // Tu dong tham gia neu slot con trong
                    updateDoc(doc(db, 'games', id), { nguoi_tham_gia: user_id }); 
                } 
                else { is_host = false; my_role = 'SPECTATOR'; }

                cac_nuoc_di = data.cac_nuoc_di || {};
                lich_su_nuoc_di = data.lich_su_nuoc_di || [];
                luot_choi = data.luot_choi;
                nguoi_thang = data.nguoi_thang;
                nuoc_di_cuoi = data.nuoc_di_cuoi;
                hang_thang = data.hang_thang || [];
                so_lan_undo = data.so_lan_undo || { X: 3, O: 3 };
                so_nguoi_xem = data.view_count || 0;
                che_do_goi_y = data.che_do_goi_y || { X: false, O: false };
                cac_goi_y = data.cac_goi_y || { X: {}, O: {} };
                
                if (is_host && data.nguoi_tham_gia && document.getElementById('modal_qr').style.display !== 'none') {
                    playSound('join'); dong_modal('modal_qr'); alert("Người chơi thứ 2 đã tham gia!");
                }

                const chat_cu = lich_su_chat.length;
                lich_su_chat = data.lich_su_chat || [];
                render_chat();
                if (lich_su_chat.length > chat_cu) {
                    const last_msg = lich_su_chat[lich_su_chat.length - 1];
                    if (last_msg.sender !== my_role) { playSound('chat'); if (!is_chat_open) document.getElementById('thong_bao_tin_moi').style.display = 'flex'; }
                }

                if (data.undo_request) xu_ly_undo_remote(data.undo_request, id);
                
                // QUAN TRONG: CAP NHAT UI NGAY LAP TUC
                cap_nhat_ui(); 
                ve_ban_co();
            });
        }
        
        function xu_ly_undo_remote(req, id) {
             if (req.status === 'pending' && req.requester !== my_role && my_role !== 'SPECTATOR') document.getElementById('modal_confirm_undo').style.display = 'flex';
             else if (req.status === 'accepted' && req.requester === my_role) { alert("Được đồng ý!"); updateDoc(doc(db, 'games', id), { undo_request: null }); }
             else if (req.status === 'rejected' && req.requester === my_role) { alert("Bị từ chối!"); updateDoc(doc(db, 'games', id), { undo_request: null }); }
             else if (req.requester !== my_role) document.getElementById('modal_confirm_undo').style.display = 'none';
        }

        window.bat_tat_team_mode = async function() {
            if (my_role === 'SPECTATOR') return;
            const my_status = !che_do_goi_y[my_role];
            await updateDoc(doc(db, 'games', room_id), { 
                [`che_do_goi_y.${my_role}`]: my_status,
                [`cac_goi_y.${my_role}`]: {} 
            });
        }

        async function gui_goi_y(id, target_role) {
            await updateDoc(doc(db, 'games', room_id), { 
                [`cac_goi_y.${target_role}.${user_id}`]: id 
            });
        }

        async function gui_nuoc_di(h, c) {
            const id = `${h},${c}`;
            if (!room_id) {
                cac_nuoc_di[id] = luot_choi;
                nuoc_di_cuoi = id;
                const thang = tinh_toan_thang(h, c, luot_choi, cac_nuoc_di);
                if (thang) { nguoi_thang = luot_choi; hang_thang = thang; }
                else luot_choi = (luot_choi === 'X' ? 'O' : 'X');
                ve_ban_co(); cap_nhat_ui(); return;
            }
            if (luot_choi !== my_role) return;
            cac_nuoc_di[id] = my_role; nuoc_di_cuoi = id;
            const thang = tinh_toan_thang(h, c, my_role, cac_nuoc_di);
            
            // CAP NHAT LOCAL TRUOC (OPTIMISTIC UI)
            ve_ban_co(); 
            
            await updateDoc(doc(db, 'games', room_id), {
                [`cac_nuoc_di.${id}`]: my_role,
                lich_su_nuoc_di: [...lich_su_nuoc_di, { id, player: my_role }],
                luot_choi: thang ? my_role : (my_role === 'X' ? 'O' : 'X'),
                nguoi_thang: thang ? my_role : null,
                hang_thang: thang || [],
                nuoc_di_cuoi: id,
                undo_request: null,
                [`cac_goi_y.X`]: {}, 
                [`cac_goi_y.O`]: {}, 
                last_active: Date.now() 
            });
        }

        function tinh_toan_thang(h, c, player, board) { 
            const dirs = [[0,1], [1,0], [1,1], [1,-1]]; 
            for (let [dh, dc] of dirs) {
                let line = [`${h},${c}`], count = 1;
                for (let k=1; k<5; k++) { const id = `${h + dh*k},${c + dc*k}`; if (board[id] === player) { count++; line.push(id); } else break; }
                for (let k=1; k<5; k++) { const id = `${h - dh*k},${c - dc*k}`; if (board[id] === player) { count++; line.push(id); } else break; }
                if (count >= 5) return line; 
            } 
            return null;
        }

        function ve_ban_co() {
            const luoi = document.getElementById('luoi_co');
            const keys = Object.keys(cac_nuoc_di);
            let min_h, max_h, min_c, max_c;
            if (keys.length > 0) {
                min_h = Infinity; max_h = -Infinity; min_c = Infinity; max_c = -Infinity;
                keys.forEach(k => {
                    const [h,c] = k.split(',').map(Number);
                    if(h<min_h) min_h=h; if(h>max_h) max_h=h;
                    if(c<min_c) min_c=c; if(c>max_c) max_c=c;
                });
            } else { min_h = 0; max_h = 0; min_c = 0; max_c = 0; }
            const start_h = min_h - PADDING; const end_h = max_h + PADDING;
            const start_c = min_c - PADDING; const end_c = max_c + PADDING;
            luoi.dataset.minH = start_h; luoi.dataset.minC = start_c;
            const rows = end_h - start_h + 1; const cols = end_c - start_c + 1;
            luoi.style.gridTemplateColumns = `repeat(${cols}, auto)`;
            luoi.style.gridTemplateRows = `repeat(${rows}, auto)`;
            luoi.innerHTML = '';
            
            let my_suggestions = {}; 
            let self_suggest_id = null; 

            if (my_role === 'SPECTATOR') {
                const target_pool = cac_goi_y[luot_choi] || {};
                if (target_pool[user_id]) self_suggest_id = target_pool[user_id];
            } else {
                const pool = cac_goi_y[my_role] || {};
                Object.values(pool).forEach(coord => {
                    my_suggestions[coord] = (my_suggestions[coord] || 0) + 1;
                });
            }

            for (let h=start_h; h<=end_h; h++) {
                for (let c=start_c; c<=end_c; c++) {
                    const id = `${h},${c}`;
                    const div = document.createElement('div');
                    div.className = 'o_co';
                    if (cac_nuoc_di[id]) { div.textContent = cac_nuoc_di[id]; div.classList.add(cac_nuoc_di[id] === 'X' ? 'quan_x' : 'quan_o'); }
                    if (id === nuoc_di_cuoi) div.classList.add('o_vua_danh');
                    if (hang_thang.includes(id)) div.classList.add('o_thang');
                    
                    if (!cac_nuoc_di[id]) {
                        if (my_role === 'SPECTATOR' && id === self_suggest_id) {
                            div.classList.add('o_my_suggest');
                        } else if (my_suggestions[id]) {
                            div.classList.add('o_goi_y');
                            const badge = document.createElement('div');
                            badge.className = 'badge_goi_y';
                            badge.textContent = my_suggestions[id];
                            div.appendChild(badge);
                        }
                    }
                    luoi.appendChild(div);
                }
            }
            update_view_transform();
        }

        function cap_nhat_ui() {
            const div = document.getElementById('trang_thai_luot');
            const btn_replay = document.getElementById('btn_choi_lai');
            const btn_undo = document.getElementById('btn_undo');
            const btn_chat = document.getElementById('nut_mo_chat');
            const mat_xem = document.getElementById('mat_xem');
            const btn_lobby = document.getElementById('btn_lobby');
            const btn_leave = document.getElementById('btn_roi_phong');
            const btn_create = document.getElementById('btn_tao_phong');
            const btn_team = document.getElementById('btn_toggle_team');
            const icon_team = document.getElementById('icon_team');
            
            let is_team_on = false;
            if (room_id && che_do_goi_y[luot_choi]) is_team_on = true;
            icon_team.style.display = is_team_on ? 'inline-block' : 'none';
            
            if (room_id) {
                if (!is_chat_open) btn_chat.style.display = 'flex';
                mat_xem.style.display = 'flex';
                let display_views = Math.max(0, so_nguoi_xem - 2);
                mat_xem.innerHTML = `👁️ ${display_views}`;
                
                btn_lobby.style.display = 'none';
                btn_create.style.display = 'none';
                btn_leave.style.display = 'block';
                
                if (my_role === 'X' || my_role === 'O') {
                    btn_team.style.display = 'block';
                    const status = che_do_goi_y[my_role];
                    btn_team.textContent = status ? "Tắt Gợi Ý" : "Bật Gợi Ý";
                    btn_team.className = status ? "btn-team btn-team-active" : "btn-team";
                } else {
                    btn_team.style.display = 'none';
                }
                
            } else {
                btn_lobby.style.display = 'block';
                btn_create.style.display = 'block';
                btn_leave.style.display = 'none';
                mat_xem.style.display = 'none';
                btn_chat.style.display = 'none';
                btn_team.style.display = 'none';
            }

            if (nguoi_thang) {
                div.innerHTML = `<span class="vang" style="padding:4px 8px;border-radius:4px">CHIẾN THẮNG: ${nguoi_thang}</span>`;
                if ((is_host || !room_id) && my_role !== 'SPECTATOR') btn_replay.style.display = 'block';
                btn_undo.style.display = 'none';
            } else {
                let html = `Lượt: <span class="luot_choi_hien_thi ${luot_choi==='X'?'do':'xanh'}">${luot_choi}</span>`;
                if (room_id) {
                    if (my_role === 'SPECTATOR') {
                         html += ` <span class="spectator-badge">Đang xem</span>`;
                         if (is_team_on) html += ` <span class="luot_choi_hien_thi tim">Gợi ý cho ${luot_choi}</span>`;
                         btn_undo.style.display = 'none';
                    } else {
                        html += ` (Bạn: ${my_role})`;
                        if (luot_choi === my_role) html += ` <span class="den-luot-ban">ĐẾN LƯỢT BẠN!</span>`;
                        btn_undo.style.display = 'block'; btn_undo.textContent = `Xin lại (${so_lan_undo[my_role]})`;
                        const canUndo = so_lan_undo[my_role] > 0 && lich_su_nuoc_di.length > 0 && lich_su_nuoc_di[lich_su_nuoc_di.length-1].player === my_role;
                        btn_undo.disabled = !canUndo;
                        if (document.getElementById('btn_undo').textContent === "Đang xin...") btn_undo.disabled = true;
                    }
                } else {
                    html += ` (Solo)`;
                    btn_undo.style.display = 'block';
                    btn_undo.textContent = "Chơi lại";
                    btn_undo.onclick = () => window.location.reload(); 
                    btn_replay.style.display = 'block';
                    btn_replay.textContent = "Ván Mới";
                }
                div.innerHTML = html;
                if (!nguoi_thang && !room_id) btn_replay.style.display = 'block';
            }
        }

        init();
    </script>
</body>
</html>
