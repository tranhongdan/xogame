<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XO Online - Phiên bản 2026</title>
    <style>
        :root { --cell-size: 40px; --font-size: 20px; --paper-bg: #ffffff; --grid-line: #cbd5e1; --text-color: #1e293b; }
        body { margin: 0; padding: 0; background-color: #f1f5f9; color: var(--text-color); font-family: ui-sans-serif, system-ui, sans-serif; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
        
        #thong_tin { flex: 0 0 auto; padding: 0.5rem; background-color: #1e293b; color: #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); z-index: 20; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
        .left-info { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        h1 { margin: 0; font-size: 1rem; font-weight: bold; color: #facc15; white-space: nowrap; }
        
        /* Hiển thị số lượng người */
        .count-badge { font-size: 0.75rem; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 12px; display: flex; gap: 8px; color: #94a3b8; }
        .count-badge b { color: #f1f5f9; }

        #vung_id_phong { background: #334155; padding: 2px 8px; border-radius: 4px; cursor: pointer; display: none; font-size: 0.8rem; border: 1px solid #475569; }
        .bang_dieu_khien { display: flex; gap: 5px; align-items: center; overflow-x: auto; max-width: 100%; padding-bottom: 2px; }
        #input_ten_phong { padding: 6px; border-radius: 4px; border: none; font-size: 0.8rem; width: 110px; background: #0f172a; color: white; outline: none; }
        
        .luot_choi_hien_thi { padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; white-space: nowrap; }
        .xanh { background-color: #3b82f6; color: white; }
        .do { background-color: #ef4444; color: white; }
        .vang { background-color: #facc15; color: black; }
        
        #khung_ban_co { flex: 1; position: relative; overflow: hidden; background-color: #f8fafc; cursor: grab; }
        #luoi_co { position: absolute; display: grid; border-top: 1px solid var(--grid-line); border-left: 1px solid var(--grid-line); grid-auto-rows: var(--cell-size); grid-auto-columns: var(--cell-size); pointer-events: none; }
        .o_co { background-color: var(--paper-bg); display: flex; justify-content: center; align-items: center; font-weight: bold; position: relative; width: var(--cell-size); height: var(--cell-size); box-sizing: border-box; font-size: var(--font-size); border-right: 1px solid var(--grid-line); border-bottom: 1px solid var(--grid-line); }
        .quan_x { color: #ef4444; } .quan_o { color: #3b82f6; }
        .o_vua_danh::after { content: ''; position: absolute; inset: 0; background-color: rgba(56, 189, 248, 0.2); }
        .o_thang::before { content: ''; position: absolute; inset: 0; background-color: #fef08a; z-index: -1; animation: thang_cuoc 0.5s infinite alternate; }
        @keyframes thang_cuoc { from { transform: scale(1); } to { transform: scale(1.1); } }
        
        button { background-color: #334155; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 0.8rem; white-space: nowrap; }
        .btn-primary { background-color: #2563eb; }
        .btn-success { background-color: #16a34a; }
        .btn-danger { background-color: #dc2626; }
        
        .modal_overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 50; }
        .modal_content { background: #1e293b; color: white; padding: 1.5rem; border-radius: 0.5rem; text-align: center; width: 450px; max-width: 90%; }
        .lobby-list { max-height: 50vh; overflow-y: auto; margin-top: 10px; border: 1px solid #334155; border-radius: 4px; }
        .room-item { padding: 12px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; background: #0f172a; cursor: pointer; }
        #ban_quyen { padding: 5px; text-align: center; font-size: 0.7rem; color: #64748b; background-color: #f1f5f9; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>

    <div id="thong_tin">
        <div class="left-info">
            <h1>XO Online</h1>
            <div id="vung_id_phong" onclick="copy_id_phong()">Mã: <span id="txt_room_id" style="color:#facc15; font-weight:bold;"></span></div>
            <div class="count-badge" id="badges_nguoi_dung" style="display:none;">
                <span>Chơi: <b id="txt_count_players">0/2</b></span>
                <span>Xem: <b id="txt_count_viewers">0</b></span>
            </div>
            <div id="trang_thai_luot">
                <span id="hien_thi_luot" class="luot_choi_hien_thi do">Đang tải...</span>
            </div>
        </div>
        
        <div class="bang_dieu_khien">
            <input type="text" id="input_ten_phong" placeholder="Tên phòng...">
            <button id="btn_tao_phong" onclick="tao_phong_moi()" class="btn-primary">Tạo Phòng</button>
            <button id="btn_lobby" onclick="mo_lobby()" class="btn-success">Danh Sách</button>
            <button id="btn_roi_phong" onclick="roi_phong(true)" class="btn-danger" style="display:none;">Thoát</button>
            <button id="btn_choi_lai" onclick="kich_hoat_choi_lai()" class="btn-primary" style="display:none;">Ván Mới</button>
        </div>
    </div>

    <div id="khung_ban_co">
        <div id="luoi_co"></div>
    </div>

    <div id="ban_quyen">Trần Hồng Dân - tranhongdan@tranphudlk.edu.vn</div>

    <div id="modal_lobby" class="modal_overlay">
        <div class="modal_content">
            <h2 style="color:#facc15; margin-top:0;">Danh Sách Phòng Online</h2>
            <div id="danh_sach_phong" class="lobby-list"></div>
            <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
                <button onclick="mo_lobby()" class="btn-primary">Làm mới</button>
                <button onclick="dong_modal('modal_lobby')" style="background:#475569">Đóng</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, collection, query, orderBy, limit, getDocs, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2Q9kQMtdXu9D22yaNH618EbcIs2cNVGU",
            authDomain: "xogame-27755.firebaseapp.com",
            projectId: "xogame-27755",
            storageBucket: "xogame-27755.firebasestorage.app",
            messagingSenderId: "407277278988",
            appId: "1:407277278988:web:62872131b964dbfe289b29"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let user_id, room_id, is_host = false, my_role = 'X', unsubscribe = null;
        let cac_nuoc_di = {}, luot_choi = 'X', nguoi_thang = null, hang_thang = [], nuoc_di_cuoi = null;
        let currentZoom = 40, viewOffsetX = 0, viewOffsetY = 0, PADDING = 3, TIMEOUT_MS = 5 * 60 * 1000;

        async function init() {
            const container = document.getElementById('khung_ban_co');
            viewOffsetX = container.clientWidth / 2; viewOffsetY = container.clientHeight / 2;
            ve_ban_co(); setup_interaction();
            try {
                await signInAnonymously(auth); user_id = auth.currentUser.uid;
                const urlParams = new URLSearchParams(window.location.search);
                const rP = urlParams.get('room');
                if (rP) { room_id = rP; lang_nghe_phong(room_id); } 
                else { document.getElementById('hien_thi_luot').textContent = "Sẵn sàng"; }
            } catch (e) { alert("Lỗi kết nối Server!"); }
        }

        window.tao_phong_moi = async function() {
            const ten = document.getElementById('input_ten_phong').value.trim() || ("Phòng của " + user_id.substring(0,4));
            room_id = Math.random().toString(36).substring(2, 7).toUpperCase();
            is_host = true; my_role = 'X';
            await setDoc(doc(db, 'games', room_id), {
                ten_phong: ten, cac_nuoc_di: {}, luot_choi: 'X', nguoi_tao: user_id, nguoi_tham_gia: null,
                ngay_tao: Date.now(), last_active: Date.now(), view_count: 0
            });
            lang_nghe_phong(room_id);
            const url = new URL(window.location); url.searchParams.set('room', room_id); window.history.pushState({}, '', url);
        }

        function lang_nghe_phong(id) {
            updateDoc(doc(db, 'games', id), { view_count: increment(1), last_active: Date.now() });
            unsubscribe = onSnapshot(doc(db, 'games', id), (ds) => {
                if (!ds.exists()) { reset_local(); return; }
                const data = ds.data();
                
                // Logic xóa phòng tự động
                const idle = Date.now() - data.last_active > TIMEOUT_MS;
                const no_players = !data.nguoi_tao && !data.nguoi_tham_gia;
                if (idle || no_players) { deleteDoc(doc(db, 'games', id)); return; }

                if (data.nguoi_tao === user_id) { is_host = true; my_role = 'X'; }
                else if (data.nguoi_tham_gia === user_id) { is_host = false; my_role = 'O'; }
                else if (!data.nguoi_tham_gia) { updateDoc(doc(db, 'games', id), { nguoi_tham_gia: user_id }); }
                else { my_role = 'SPECTATOR'; }
                
                cac_nuoc_di = data.cac_nuoc_di || {}; luot_choi = data.luot_choi;
                nguoi_thang = data.nguoi_thang; hang_thang = data.hang_thang || [];
                nuoc_di_cuoi = data.nuoc_di_cuoi; 
                
                // Cập nhật số lượng người chơi/xem
                const p_count = (data.nguoi_tao?1:0) + (data.nguoi_tham_gia?1:0);
                document.getElementById('txt_count_players').textContent = `${p_count}/2`;
                document.getElementById('txt_count_viewers').textContent = Math.max(0, data.view_count - p_count);
                
                cap_nhat_ui(); ve_ban_co();
            });
        }

        window.mo_lobby = async function() {
            document.getElementById('modal_lobby').style.display = 'flex';
            const list = document.getElementById('danh_sach_phong');
            list.innerHTML = '<div style="padding:10px;">Đang tìm phòng...</div>';
            const q = query(collection(db, "games"), orderBy("last_active", "desc"), limit(20));
            const snap = await getDocs(q);
            list.innerHTML = '';
            let count = 0;
            snap.forEach(d => {
                const data = d.data();
                if (Date.now() - data.last_active > TIMEOUT_MS) return;
                count++;
                const item = document.createElement('div');
                item.className = 'room-item';
                const p_count = (data.nguoi_tao?1:0) + (data.nguoi_tham_gia?1:0);
                item.innerHTML = `<div style="text-align:left"><b style="color:#facc15">${data.ten_phong}</b><br><small style="color:#94a3b8">ID: ${d.id}</small></div>
                                  <div style="text-align:right"><span class="${p_count>=2?'status-full':'status-wait'}" style="padding:2px 6px; border-radius:4px; font-size:0.7rem;">${p_count>=2?'Đầy':'Chờ'}</span><br><small>${p_count}/2 người</small></div>`;
                item.onclick = () => window.location.href = `?room=${d.id}`;
                list.appendChild(item);
            });
            if(count===0) list.innerHTML = '<div style="padding:20px; color:#64748b;">Hiện không có phòng nào.</div>';
        }

        function ve_ban_co() {
            const luoi = document.getElementById('luoi_co');
            const keys = Object.keys(cac_nuoc_di);
            let minH=0, maxH=0, minC=0, maxC=0;
            if (keys.length > 0) {
                minH=Infinity; maxH=-Infinity; minC=Infinity; maxC=-Infinity;
                keys.forEach(k => { const [h,c] = k.split(',').map(Number); minH=Math.min(minH,h); maxH=Math.max(maxH,h); minC=Math.min(minC,c); maxC=Math.max(maxC,c); });
            }
            const sH = minH-PADDING, eH = maxH+PADDING, sC = minC-PADDING, eC = maxC+PADDING;
            luoi.style.gridTemplateColumns = `repeat(${eC-sC+1}, auto)`;
            luoi.innerHTML = '';
            for (let h=sH; h<=eH; h++) {
                for (let c=sC; c<=eC; c++) {
                    const id = `${h},${c}`, div = document.createElement('div');
                    div.className = 'o_co';
                    if (cac_nuoc_di[id]) { div.textContent = cac_nuoc_di[id]; div.classList.add(cac_nuoc_di[id]==='X'?'quan_x':'quan_o'); }
                    if (id === nuoc_di_cuoi) div.classList.add('o_vua_danh');
                    if (hang_thang.includes(id)) div.classList.add('o_thang');
                    luoi.appendChild(div);
                }
            }
            luoi.style.left = `${viewOffsetX + sC * currentZoom}px`;
            luoi.style.top = `${viewOffsetY + sH * currentZoom}px`;
            document.documentElement.style.setProperty('--cell-size', `${currentZoom}px`);
            document.documentElement.style.setProperty('--font-size', `${currentZoom*0.5}px`);
        }

        function cap_nhat_ui() {
            document.getElementById('vung_id_phong').style.display = room_id ? 'block' : 'none';
            document.getElementById('txt_room_id').textContent = room_id || '';
            document.getElementById('badges_nguoi_dung').style.display = room_id ? 'flex' : 'none';
            document.getElementById('input_ten_phong').style.display = room_id ? 'none' : 'block';
            document.getElementById('btn_tao_phong').style.display = room_id ? 'none' : 'block';
            document.getElementById('btn_roi_phong').style.display = room_id ? 'block' : 'none';
            
            const trthai = document.getElementById('hien_thi_luot');
            if (nguoi_thang) {
                trthai.className = 'luot_choi_hien_thi vang'; trthai.textContent = `THẮNG: ${nguoi_thang}`;
                if (is_host || !room_id) document.getElementById('btn_choi_lai').style.display = 'block';
            } else {
                trthai.className = `luot_choi_hien_thi ${luot_choi==='X'?'do':'xanh'}`;
                let txt = `Lượt: ${luot_choi}`;
                if (my_role !== 'SPECTATOR') txt += (my_role===luot_choi ? " (Bạn)" : " (Đối thủ)");
                else txt += " (Xem)";
                trthai.textContent = txt;
                document.getElementById('btn_choi_lai').style.display = 'none';
            }
        }

        async function xu_ly_danh(h, c) {
            const id = `${h},${c}`;
            if (cac_nuoc_di[id] || nguoi_thang || my_role === 'SPECTATOR') return;
            if (room_id && luot_choi !== my_role) return;
            
            const win = tinh_win(h, c, luot_choi, cac_nuoc_di);
            if (!room_id) {
                cac_nuoc_di[id] = luot_choi; nuoc_di_cuoi = id;
                if (win) { nguoi_thang = luot_choi; hang_thang = win; } else luot_choi = (luot_choi==='X'?'O':'X');
                ve_ban_co(); cap_nhat_ui(); return;
            }

            await updateDoc(doc(db, 'games', room_id), {
                [`cac_nuoc_di.${id}`]: my_role,
                luot_choi: win ? my_role : (my_role==='X'?'O':'X'),
                nguoi_thang: win ? my_role : null,
                hang_thang: win || [],
                nuoc_di_cuoi: id,
                last_active: Date.now()
            });
        }

        function tinh_win(h, c, p, b) {
            const ds = [[0,1],[1,0],[1,1],[1,-1]];
            for (let [dh, dc] of ds) {
                let line = [`${h},${c}`], count = 1;
                for (let k=1; k<5; k++) { const id=`${h+dh*k},${c+dc*k}`; if(b[id]===p){count++; line.push(id);} else break; }
                for (let k=1; k<5; k++) { const id=`${h-dh*k},${c-dc*k}`; if(b[id]===p){count++; line.push(id);} else break; }
                if (count>=5) return line;
            } return null;
        }

        function setup_interaction() {
            const box = document.getElementById('khung_ban_co');
            let isDrag = false, sX, sY, moved = false;
            box.onpointerdown = (e) => { isDrag = true; sX = e.clientX; sY = e.clientY; moved = false; };
            window.onpointermove = (e) => {
                if (!isDrag) return;
                const dX = e.clientX - sX; const dY = e.clientY - sY;
                if (Math.abs(dX)>5 || Math.abs(dY)>5) moved = true;
                viewOffsetX += dX; viewOffsetY += dY; sX = e.clientX; sY = e.clientY; ve_ban_co();
            };
            window.onpointerup = (e) => {
                if (isDrag && !moved) {
                    const rect = box.getBoundingClientRect();
                    const c = Math.floor((e.clientX - rect.left - viewOffsetX) / currentZoom);
                    const h = Math.floor((e.clientY - rect.top - viewOffsetY) / currentZoom);
                    xu_ly_danh(h, c);
                }
                isDrag = false;
            };
            box.addEventListener('wheel', (e) => { e.preventDefault(); currentZoom = Math.min(Math.max(currentZoom - Math.sign(e.deltaY)*5, 20), 100); ve_ban_co(); }, {passive:false});
        }

        window.copy_id_phong = () => { navigator.clipboard.writeText(room_id); alert("Đã sao chép mã phòng!"); }
        window.dong_modal = (id) => document.getElementById(id).style.display = 'none';
        
        window.roi_phong = async (manual) => {
            if (room_id) {
                const up = { view_count: increment(-1) };
                if (is_host) up.nguoi_tao = null; else if (my_role==='O') up.nguoi_tham_gia = null;
                await updateDoc(doc(db, 'games', room_id), up);
            }
            window.location.href = window.location.pathname;
        }
        
        function reset_local() { if(unsubscribe) unsubscribe(); window.location.href = window.location.pathname; }
        
        window.kich_hoat_choi_lai = async () => {
            if (room_id) await updateDoc(doc(db, 'games', room_id), { cac_nuoc_di: {}, luot_choi: 'X', nguoi_thang: null, hang_thang: [], nuoc_di_cuoi: null, last_active: Date.now() });
            else location.reload();
        }

        init();
    </script>
</body>
</html>
